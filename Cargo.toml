[workspace]
members = ["crates/cli","crates/core"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Ahmed Said"]
license = "MIT"
repository = "https://github.com/TheJacksonLaboratory/xenium-panel-convert"
version = "0.7.2"
description = "A command-line utility for converting files to the formats accepted by the 10x Genomics Xenium Panel Designer"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.104"
camino = {version = "1.2.5", features = ["serde1"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.5", default-features = false, features = ["std", "serde", "parse"] }
phf_codegen = { version = "0.14.0", features = ["ptrhash"] }
phf = { version = "0.14.0", features = ["ptrhash"] }
clap = { version = "4.6.6", features = ["derive"] }
hdf5-metno = { version = "0.14.1", features = ["static", "zlib", "lzf"] }
ndarray = { version = "0.17.2" }
sprs = { version = "0.11.5", default-features = false }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = { version = "2.0.20" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
implicit-hasher = "allow"
missing-errors-doc = "allow"
missing-panics-doc = "allow"

[workspace.lints.rust]
unreachable-pub = "warn"
dead-code-pub-in-binary = "warn"
elided-lifetimes-in-paths = "warn"
explicit-outlives-requirements = "warn"
missing-copy-implementations = "warn"
missing-debug-implementations = "warn"
unnameable-types = "warn"
unit-bindings = "warn"

[profile]
release = { lto = true, codegen-units = 1, strip = true }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
